<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#080f1d" />
    <meta name="description" content="NetSecure Cisco Network Security exam simulator and learning analytics." />
    <title>NetSecure — Security exam simulator</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" id="sidebar" aria-label="Main navigation">
        <a class="brand" href="#dashboard" data-view="dashboard" aria-label="NetSecure home">
          <span class="brand-mark"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 3v8m0 10v8M3 16h8m10 0h8M6.8 6.8l5.7 5.7m7 7 5.7 5.7m0-18.4-5.7 5.7m-7 7-5.7 5.7"/><circle cx="16" cy="16" r="5.2"/></svg></span>
          <span class="brand-name">netsecure<span class="brand-period">.</span></span>
        </a>

        <div class="workspace-label">LEARNING WORKSPACE</div>
        <nav class="nav-group" aria-label="Learning">
          <button class="nav-item active" data-view="dashboard"><span class="nav-icon">⌂</span>Overview</button>
          <button class="nav-item" data-view="exam-setup"><span class="nav-icon">▤</span>Exam simulator</button>
          <button class="nav-item" data-view="practice-setup"><span class="nav-icon">◉</span>Practice lab</button>
          <button class="nav-item" data-view="revision"><span class="nav-icon">✦</span>Exam revision</button>
          <button class="nav-item" data-view="analytics"><span class="nav-icon">▥</span>Learning analytics</button>
          <button class="nav-item" data-view="history"><span class="nav-icon">◷</span>Exam history</button>
          <button class="nav-item" data-view="bookmarks"><span class="nav-icon">☆</span>Saved questions</button>
        </nav>

        <div class="sidebar-spacer"></div>
        <section class="sidebar-bank" aria-label="Question bank status">
          <div class="bank-icon">⌁</div>
          <div class="bank-copy"><strong>Question bank</strong><span id="sidebar-bank-count">0 / 153 imported</span></div>
          <span class="status-dot" id="bank-dot"></span>
          <div class="bank-progress"><span id="sidebar-bank-progress"></span></div>
          <button class="text-button" data-action="import">Import question bank <span>↗</span></button>
        </section>
        <div class="sidebar-footer"><span class="avatar avatar-small">NS</span><span><strong>Local profile</strong><small>Saved on this device</small></span><button class="more-button" aria-label="Profile options">···</button></div>
      </aside>

      <div class="main-column">
        <header class="topbar">
          <button class="mobile-menu" id="mobile-menu" aria-label="Open navigation">☰</button>
          <div class="breadcrumb"><span>NetSecure</span><i>/</i><strong id="crumb-current">Overview</strong></div>
          <div class="topbar-actions">
            <label class="global-search"><span>⌕</span><input id="global-search" type="search" placeholder="Search questions…" autocomplete="off" /><kbd>⌘ K</kbd></label>
            <button class="icon-button notification-button" aria-label="Notifications"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9m-8 12h4"/></svg><span></span></button>
            <div class="avatar top-avatar">NS</div>
          </div>
        </header>
        <main id="app" tabindex="-1"></main>
      </div>
    </div>
    <input type="file" id="import-file" accept="application/json,.json" hidden />
    <div class="toast-region" id="toast-region" aria-live="polite" aria-atomic="true"></div>
    <script src="js/storage.js"></script>
    <script src="js/timer.js"></script>
    <script src="js/quiz.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
